<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self'; font-src 'self' https://fonts.gstatic.com; connect-src https://fonts.googleapis.com https://fonts.gstatic.com; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Email confirmed — Seabay</title>
  <meta name="description" content="Your Seabay email is confirmed. Open the app and sign in.">
  <link rel="icon" href="../../assets/studio-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Sora:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../../styles.css">
</head>
<body>
  <div class="particle-field" aria-hidden="true">
    <canvas id="particle-canvas"></canvas>
  </div>

  <header class="site-header">
    <div class="wrap site-nav">
      <a class="brand" href="../../index.html">CPoP Studio</a>
      <ul class="nav-links">
        <li><a href="index.html">Seabay</a></li>
        <li><a href="support.html">Support</a></li>
      </ul>
    </div>
  </header>

  <main class="wrap auth-stage">
    <section class="app-hero">
      <div class="auth-icon-wrap">
        <img class="app-hero-icon" src="../../assets/apps/seabay/icon.png" width="104" height="104" alt="Seabay app icon">
        <span class="auth-icon-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5.5 12.5l4.2 4.2 8.8-9.4"/>
          </svg>
        </span>
      </div>
      <div class="app-title">
        <p class="app-platform">Seabay</p>
        <h1 data-auth-title>Email confirmed</h1>
      </div>
      <p class="lede" data-auth-lede>Congratulations — your email is authenticated. Open Seabay and sign in with the same address.</p>
      <div class="app-cta">
        <a class="button button-primary" href="com.caiquecosta.vessla://" data-auth-open>Open Seabay</a>
      </div>
      <p class="note" data-auth-note>You can close this page after you sign in.</p>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><span class="brand-inline">CPoP Studio</span> · 2026</p>
      <div class="footer-links">
        <a href="index.html">Seabay</a>
        <a href="support.html">Support</a>
        <a href="mailto:support@cpopstudio.com">support@cpopstudio.com</a>
      </div>
    </div>
  </footer>

  <script src="../../particles.js"></script>
  <script src="confirmed.js"></script>
</body>
</html>
